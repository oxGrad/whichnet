[package]
name = "whichnet"
version = "0.2.0"
edition = "2024"
description = "Detect the current network's identity (Wi-Fi SSID, falling back to gateway MAC) on Linux and macOS"
license = "MIT"
readme = "README.md"
repository = "https://github.com/oxGrad/whichnet"
keywords = ["network", "wifi", "ssid", "netlink", "corewlan"]
categories = ["network-programming", "os"]

[dependencies]
netdev = { version = "0.47.0", features = ["gateway"] }

[target.'cfg(target_os = "linux")'.dependencies]
nl80211 = "0.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-wlan = "0.3.2"

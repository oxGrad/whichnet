name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify-version:
    uses: oxHive/pipelines/.github/workflows/rust-verify-version.yml@v2
    with:
      package-name: whichnet

  check:
    needs: verify-version
    uses: oxHive/pipelines/.github/workflows/rust-check.yml@v2

  github-release:
    needs: check
    uses: oxHive/pipelines/.github/workflows/shared-github-release.yml@v2

  publish-crates:
    needs: github-release
    uses: oxHive/pipelines/.github/workflows/rust-publish-crates.yml@v2
    permissions:
      id-token: write
      contents: read
